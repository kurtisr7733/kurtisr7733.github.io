      <h3>Overview</h3>
      <p>Closed-cell aluminum foams are light, stiff, and absorb a lot of energy, which makes them useful for crash structures and lightweight panels. They're usually made by heating a compacted mix of aluminum powder and a blowing agent in a furnace. In SDSU's Advanced Materials Processing Lab, under Dr. Khaled Morsi, I studied a faster route: electrically driven spark plasma foaming, where high current runs straight through the sample.</p>

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cover = p => p.cover
  ? `<img src="${IMG}${p.cover}" alt="${esc(p.title)}" loading="lazy" style="object-position:${p.coverPos||"center"}">`
  : `<div class="placeholder"><div>${octagon}Photos coming soon</div></div>`;

const card = p => `
  <a class="card" href="#${p.id}">
    <div class="ph">${cover(p)}<span class="tag">${p.tag}</span></div>
    <div class="bd">
      <div class="meta">${p.when} · ${esc(p.short)}</div>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.summary)}</p>
      <span class="more">View project →</span>
    </div>
  </a>`;

const pages = {
  home: () => `
    <section class="hero"><div class="wrap">
      <div>
        <div class="eyebrow">B.S. Mechanical Engineering · San Diego State University</div>

    </div></section>
    <section class="strip"><div class="wrap">
      <div><b>Defense &amp; Aerospace</b><span>NASA LunaRecycle Challenge finalist team</span></div>
      <div><b>Advanced Manufacturing</b><span>CNC milling and turning, waterjet, MIG welding, 3D printing</span></div>
      <div><b>R&amp;D Hardware Development</b><span>Lunar recycling prototypes and metal foam research</span></div>
      <div><b>Project Engineering</b><span>Requirements, risk, budgets, and team leadership</span></div>
    </div></section>
    <section class="sheet"><div class="wrap">
      <div class="head"><div><div class="eyebrow dark">Selected work</div><h2>Projects</h2></div><a class="btn navy" href="#projects">All projects</a></div>
      <div class="cards">${PROJECTS.map(card).join("")}</div>
    </div></section>`,

  projects: () => `
    <section class="band"><div class="wrap">

    </div></section>
    <section class="sheet"><div class="wrap"><div class="cards">${PROJECTS.map(card).join("")}</div></div></section>`,

  about: () => `
    <section class="band"><div class="wrap">

      <h1>Kurtis William Ramsey</h1>

    <section class="wrap about">
      <div class="frame"><img src="${IMG}kurtis.jpg" alt="Portrait of Kurtis Ramsey"></div>

function projectPage(p){
  const idx = PROJECTS.indexOf(p), next = PROJECTS[(idx+1)%PROJECTS.length];
  const gallery = p.gallery.length
    ? `<section class="wrap gallery"><h3>Photos</h3><div class="grid">${p.gallery.map(([f,c]) => `
        <figure><button type="button" data-zoom="${IMG}${f}" data-cap="${esc(c)}"><img src="${IMG}${f}" alt="${esc(c)}" loading="lazy"></button><figcaption>${esc(c)}</figcaption></figure>`).join("")}</div></section>`
    : `<section class="wrap gallery"><h3>Photos</h3><p style="color:var(--muted)">Photos from the build will be added here.</p></section>`;
  return `
    <section class="band"><div class="wrap">
      <a class="back" href="#projects">← All projects</a>
      <div class="eyebrow">${esc(p.where)}</div>
      <h1>${esc(p.title)}</h1>
      <p>${esc(p.summary)}</p>
    </div></section>
    <section class="wrap detail">
      <div style="min-width:0">
        <div class="nums">${p.nums.map(([b,s]) => `<div><b>${b}</b><span>${s}</span></div>`).join("")}</div>
        ${p.body}
      </div>
      <aside><div class="box"><dl style="margin:0;display:grid;gap:14px">
        <div><dt>When</dt><dd>${p.when}</dd></div>
        ${p.facts.map(([k,v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}
        <div><dt>Skills & tools</dt><dd><div class="chips" style="margin-top:6px">${p.tools.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div></dd></div>
      </dl></div></aside>
    </section>
    ${gallery}
    <section class="wrap" style="padding-bottom:64px"><a class="btn navy" href="#${next.id}">Next project: ${esc(next.title)} →</a></section>`;
}

const app = document.getElementById("app");
function route(){
  const id = (location.hash || "#home").slice(1);
  const p = PROJECTS.find(x => x.id === id);
  app.innerHTML = p ? projectPage(p) : (pages[id] || pages.home)();
  const active = p ? "projects" : (pages[id] ? id : "home");
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === active));
  document.title = p ? `${p.title} · Kurtis Ramsey` : "Kurtis Ramsey Portfolio";
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();

const lb = document.getElementById("lb");
document.addEventListener("click", e => {
  const z = e.target.closest("[data-zoom]");
  if (z){ document.getElementById("lbimg").src = z.dataset.zoom; document.getElementById("lbimg").alt = z.dataset.cap; document.getElementById("lbcap").textContent = z.dataset.cap; lb.hidden = false; return; }
  if (e.target === lb || e.target.id === "lbx") lb.hidden = true;
  const c = e.target.closest("[data-copy]");
  if (c){
    const done = () => { c.textContent = "Copied"; setTimeout(() => c.textContent = "Copy", 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(c.dataset.copy).then(done).catch(() => {});
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.hidden = true; });
</script>
